name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: infradesk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d infradesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INFRADESK_DB_URL: jdbc:postgresql://localhost:5432/infradesk_test
      INFRADESK_DB_USER: postgres
      INFRADESK_DB_PASSWORD: ci-postgres-password
      INFRADESK_RUN_POSTGRES_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Wait for PostgreSQL
        run: until pg_isready -h localhost -p 5432 -U postgres -d infradesk_test; do sleep 1; done
        env:
          PGPASSWORD: ci-postgres-password
      - name: Generate test-only encryption key
        run: echo "INFRADESK_SECRET_MASTER_KEY_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Compile backend
        run: sbt compile
      - name: Run backend and PostgreSQL integration tests
        run: sbt testFull

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: |
          docker build \
            --file deploy/backend.Dockerfile \
            --build-arg INFRADESK_GIT_SHA="${GITHUB_SHA}" \
            --build-arg INFRADESK_BUILD_VERSION="0.1.0-${GITHUB_SHA::7}" \
            --tag "infradesk-backend:${GITHUB_SHA::7}" \
            .
      - name: Verify backend artifact and immutable build identity
        run: |
          image="infradesk-backend:${GITHUB_SHA::7}"
          docker run --rm --entrypoint test "${image}" -x /opt/infradesk/bin/infradesk
          set +e
          identity_logs="$(docker run --rm --network none \
            -e INFRADESK_GIT_SHA=WRONG_SHA \
            -e INFRADESK_BUILD_VERSION=WRONG_VERSION \
            -e INFRADESK_DB_URL=jdbc:postgresql://127.0.0.1:1/infradesk \
            -e INFRADESK_DB_USER=infradesk \
            -e INFRADESK_DB_PASSWORD=not-a-real-password \
            -e INFRADESK_SECRET_MASTER_KEY_BASE64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "${image}" 2>&1)"
          status=$?
          set -e
          test "${status}" -ne 0
          grep "application.starting" <<< "${identity_logs}" | grep "gitSha=${GITHUB_SHA}"
          if grep -q "gitSha=WRONG_SHA\|version=WRONG_VERSION" <<< "${identity_logs}"; then
            echo "runtime environment replaced baked build identity" >&2
            exit 1
          fi
      - name: Build frontend production image
        run: |
          docker build \
            --file deploy/frontend.Dockerfile \
            --build-arg INFRADESK_GIT_SHA="${GITHUB_SHA}" \
            --tag "infradesk-frontend:${GITHUB_SHA::7}" \
            .
      - name: Write the deployment environment
        run: |
          # Compose reads .env from the project directory, so every later step sees the same
          # values without repeating them. This file is CI-only and never leaves the runner.
          {
            echo "INFRADESK_DB_PASSWORD=ci-compose-password"
            echo "INFRADESK_SECRET_MASTER_KEY_BASE64=$(openssl rand -base64 32)"
            echo "INFRADESK_BACKEND_IMAGE=infradesk-backend:${GITHUB_SHA::7}"
            echo "INFRADESK_FRONTEND_IMAGE=infradesk-frontend:${GITHUB_SHA::7}"
            echo "INFRADESK_GIT_SHA=${GITHUB_SHA}"
            echo "INFRADESK_BUILD_VERSION=0.1.0-${GITHUB_SHA::7}"
            echo "INFRADESK_HTTP_PUBLISH=127.0.0.1:8081"
          } > .env
      - name: Start the production topology
        run: |
          docker compose -f compose.prod.yml up -d
          ready=false
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8081/ready > /dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          test "${ready}" = "true"
      - name: Smoke-test the deployment
        run: ./scripts/check-production.sh http://127.0.0.1:8081
      - name: Exercise production backup and restore
        run: |
          marker_id="00000000-0000-0000-0000-000000000014"
          docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --set ON_ERROR_STOP=1 \
            --command "insert into organization (id, code, name) values ('${marker_id}', 'restore-check', 'Restore check')"
          # Build a representative production V26 dump: the version production runs before this
          # release. Restoring it proves that a real upgrade boundary is crossed — Flyway applies
          # V27 to the restored database before the backend reports itself ready. Only V27 is
          # undone here (the account audit codes it added to the check constraints); everything
          # V23 through V26 created, the V26 context column included, stays as it does in production.
          docker compose -f compose.prod.yml stop backend proxy
          docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --set ON_ERROR_STOP=1 <<'SQL'
          alter table audit_event drop constraint ck_audit_event_action;
          alter table audit_event add constraint ck_audit_event_action check (action in (
            'PROJECT_CREATED','ENVIRONMENT_CREATED','CONNECTION_CREATED','CONNECTION_UPDATED',
            'CONNECTION_DELETED','MONITOR_RULE_CREATED','MONITOR_RULE_UPDATED','MANUAL_SYNC_REQUESTED',
            'CONTAINER_START_REQUESTED','CONTAINER_STOP_REQUESTED','CONTAINER_RESTART_REQUESTED',
            'NOTIFICATION_CHANNEL_CREATED','NOTIFICATION_CHANNEL_UPDATED',
            'NOTIFICATION_CHANNEL_ENABLED','NOTIFICATION_CHANNEL_DISABLED'));
          alter table audit_event drop constraint ck_audit_event_target_type;
          alter table audit_event add constraint ck_audit_event_target_type check (target_type in (
            'PROJECT','ENVIRONMENT','CONNECTION','MONITOR_RULE','RESOURCE','NOTIFICATION_CHANNEL'));
          delete from flyway_schema_history where version = '27';
          SQL
          INFRADESK_BACKUP_DIR="${RUNNER_TEMP}/infradesk-backups" \
            ./scripts/backup-database.sh
          dump="$(find "${RUNNER_TEMP}/infradesk-backups" -name 'infradesk-*.dump' -type f -print -quit)"
          test -n "${dump}"
          # Mutate the source database after the backup. The restore must replace the database,
          # recover the marker and let Flyway apply V27 to it.
          docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --set ON_ERROR_STOP=1 \
            --command "delete from organization where id = '${marker_id}'"
          ./scripts/restore-database.sh "${dump}"
          ready=false
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8081/ready > /dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          test "${ready}" = "true"
          restored="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from organization where id = '${marker_id}'")"
          test "${restored}" = "1"
          migrated="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select version from flyway_schema_history where success order by installed_rank desc limit 1")"
          test "${migrated}" = "27"
          # What V26 built survives the upgrade: the notification_delivery.context column was in the
          # dump and is still there after Flyway ran V27 on the restored database.
          delivery_context="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from information_schema.columns where table_schema = current_schema() and table_name = 'notification_delivery' and column_name = 'context'")"
          test "${delivery_context}" = "1"
          # And what V27 adds: the account audit action is now allowed by the check constraint,
          # produced again by the upgrade Flyway ran on the restored database.
          account_audit="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from pg_constraint where conname = 'ck_audit_event_action' and pg_get_constraintdef(oid) like '%ACCOUNT_PASSWORD_CHANGED%'")"
          test "${account_audit}" = "1"
          credential_kind="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from pg_constraint where conname = 'ck_connection_secret_kind' and pg_get_constraintdef(oid) like '%SSH_CREDENTIAL%'")"
          test "${credential_kind}" = "1"
          channel_tables="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from information_schema.tables where table_schema = current_schema() and table_name in ('notification_channel', 'notification_channel_secret')")"
          test "${channel_tables}" = "2"
          # What V23 built is still there after the upgrade, constraints included.
          channel_constraints="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from pg_constraint where (conname = 'ck_notification_delivery_channel' and pg_get_constraintdef(oid) like '%TELEGRAM%') or (conname = 'ck_audit_event_target_type' and pg_get_constraintdef(oid) like '%NOTIFICATION_CHANNEL%') or (conname = 'ck_notification_channel_settings')")"
          test "${channel_constraints}" = "3"
          # What V24 built survives the upgrade too: the mail type, its columns, its constraints.
          email_type="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from pg_constraint where conname = 'ck_notification_channel_type' and pg_get_constraintdef(oid) like '%EMAIL%'")"
          test "${email_type}" = "1"
          email_columns="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from information_schema.columns where table_schema = current_schema() and table_name = 'notification_channel' and column_name in ('smtp_host', 'smtp_port', 'smtp_security', 'smtp_username', 'smtp_from_address', 'smtp_recipients')")"
          test "${email_columns}" = "6"
          email_constraints="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from pg_constraint where conname in ('ck_notification_channel_smtp_port', 'ck_notification_channel_smtp_security')")"
          test "${email_constraints}" = "2"
          # And what V25 adds: a delivery names its channel, the tenant foreign key holds it to
          # the same organization, and each kind of target has its own idempotency index.
          delivery_channel="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from information_schema.columns where table_schema = current_schema() and table_name = 'notification_delivery' and column_name = 'notification_channel_id'")"
          test "${delivery_channel}" = "1"
          delivery_constraints="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from pg_constraint where conname in ('fk_notification_delivery_channel_tenant', 'ck_notification_delivery_legacy_target')")"
          test "${delivery_constraints}" = "2"
          delivery_indexes="$(docker compose -f compose.prod.yml exec -T postgres \
            psql --username infradesk --dbname infradesk --tuples-only --no-align \
            --command "select count(*) from pg_indexes where schemaname = current_schema() and indexname in ('ux_notification_delivery_legacy_event', 'ux_notification_delivery_managed_event')")"
          test "${delivery_indexes}" = "2"
          ./scripts/check-production.sh http://127.0.0.1:8081
      - name: Separate liveness from readiness while the database is down
        run: |
          docker compose -f compose.prod.yml stop postgres
          live=""
          ready=""
          curl_status=1
          for _ in $(seq 1 12); do
            live="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
              http://127.0.0.1:8081/health || echo 000)"
            # Readiness has a three-second budget of its own, the proxy waits seven, and this
            # waits twelve: the client must see the application's answer, not a gateway timeout.
            set +e
            ready="$(curl --silent --output "${RUNNER_TEMP}/ready-body" \
              --write-out '%{http_code}' --max-time 12 http://127.0.0.1:8081/ready)"
            curl_status=$?
            set -e
            if [ "${live}" = "200" ] && [ "${ready}" = "503" ]; then break; fi
            sleep 5
          done
          echo "health=${live} ready=${ready} curl=${curl_status}"
          # The process is alive, so liveness answers.
          test "${live}" = "200"
          # The transport completed: this is InfraDesk reporting itself unavailable, not nginx
          # giving up on it, and not a connection that never produced a response.
          test "${curl_status}" = "0"
          test "${ready}" = "503"
          # A failing dependency must not describe itself to the internet.
          for leak in password postgresql jdbc exception ru.bitec; do
            if grep -qi -- "${leak}" "${RUNNER_TEMP}/ready-body"; then
              echo "readiness body leaked '${leak}'" >&2
              exit 1
            fi
          done
          docker compose -f compose.prod.yml start postgres
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8081/ready > /dev/null; then break; fi
            sleep 5
          done
          curl --silent --fail http://127.0.0.1:8081/ready > /dev/null
      - name: Shut the backend down on SIGTERM
        run: |
          container="$(docker compose -f compose.prod.yml ps -q backend)"
          started="$(date +%s)"
          # `compose stop` sends SIGTERM and only escalates after stop_grace_period; a runtime that
          # needed the escalation would take the whole grace period and report 137.
          docker compose -f compose.prod.yml stop backend
          elapsed=$(( $(date +%s) - started ))
          code="$(docker inspect --format '{{.State.ExitCode}}' "${container}")"
          echo "backend exited with ${code} after ${elapsed}s"
          test "${code}" = "0" -o "${code}" = "143"
          test "${elapsed}" -lt 30
          docker compose -f compose.prod.yml start backend
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8081/ready > /dev/null; then break; fi
            sleep 5
          done
          curl --silent --fail http://127.0.0.1:8081/ready > /dev/null
      - name: Assert the database and the backend are not published
        run: |
          # The proxy is the only service with a host port in the production topology.
          for service in postgres backend; do
            container="$(docker compose -f compose.prod.yml ps -q "${service}")"
            published="$(docker inspect --format \
              '{{range .NetworkSettings.Ports}}{{if .}}{{.}}{{end}}{{end}}' \
              "${container}")"
            if [ -n "${published}" ]; then
              echo "${service} must not publish a host port" >&2
              exit 1
            fi
          done
          test "$(docker compose -f compose.prod.yml port proxy 80)" = "127.0.0.1:8081"
      - name: Assert the deployment reports the build it runs
        run: docker compose -f compose.prod.yml logs backend | grep "application.started" | grep "gitSha=${GITHUB_SHA}"
      - name: Collect logs on failure
        if: failure()
        run: docker compose -f compose.prod.yml logs --no-color --tail 200
      - name: Stop the production topology
        if: always()
        run: docker compose -f compose.prod.yml down -v
