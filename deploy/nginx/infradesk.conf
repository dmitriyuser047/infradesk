# The single entrypoint of a deployment: static frontend plus the API on one origin, so the
# session cookie needs no cross-site relaxation and no CORS is involved.

# Login is the one endpoint worth rate limiting at the edge, where it costs the backend nothing.
limit_req_zone $binary_remote_addr zone=infradesk_login:10m rate=10r/m;

# The proxy decides what the backend sees; a forwarded header sent by the client is not trusted.
map $http_x_request_id $infradesk_request_id {
  default         $http_x_request_id;
  ""              $request_id;
}

server {
  listen 80;
  server_name _;

  # TLS terminates in front of this container (see docs/production.md); the scheme it reports is
  # what the backend treats as the external protocol.
  set $forwarded_scheme $http_x_forwarded_proto;
  if ($forwarded_scheme = "") {
    set $forwarded_scheme $scheme;
  }

  client_max_body_size 1m;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Hashed bundles never change under the same name; the entry point must not be pinned.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /api/v1/auth/login {
    limit_req zone=infradesk_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/conf.d/infradesk-proxy.inc;
  }

  location /api/ {
    include /etc/nginx/conf.d/infradesk-proxy.inc;
  }

  location = /health {
    include /etc/nginx/conf.d/infradesk-proxy.inc;
  }

  location = /ready {
    include /etc/nginx/conf.d/infradesk-proxy.inc;
  }

  # React Router owns the client-side routes: a deep link has to return the application shell.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
